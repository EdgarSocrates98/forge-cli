name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
      - name: Verificar versão da tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag difere de package.json $pkg" >&2
            exit 1
          fi
      - name: Empacotar
        run: npm pack
      # npm publish lives exclusively in publish-npm.yml (OIDC trusted
      # publishing + `environment: npm` + packed-artifact binding +
      # post-publish verify). This workflow is GitHub-release-only so a
      # tag push can never ship an unverified repacked tarball or fall
      # back to a long-lived NPM_TOKEN.
      - name: GitHub Release (tarball)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes --verify-tag
