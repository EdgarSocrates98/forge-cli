name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows-latest = rótulo pedido pelo lf-0019 (hoje resolve para
        # windows-2025 — mesma imagem, mantém o gate sobre a linha móvel).
        os: [ubuntu-24.04, windows-latest, macos-15]
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Build and verify portable distribution pack
        shell: bash
        run: |
          node dist/index.js pack create "$RUNNER_TEMP/forge-cli-portable.zip" --dir . --json > "$RUNNER_TEMP/portable-create.json"
          node dist/index.js pack verify "$RUNNER_TEMP/forge-cli-portable.zip" --json
      - name: Federated capability matrix contract
        shell: bash
        run: |
          node dist/index.js workspace federation --dir . --json > "$RUNNER_TEMP/federated-matrix.json"
          node -e '
            const fs = require("node:fs");
            const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (value.schema !== "forge/FederatedCapabilityMatrix/v1") throw new Error("schema inválido");
            if (!Array.isArray(value.entries) || value.entries.length < 1) throw new Error("matriz vazia");
            if (!value.contract_ids.includes("ForgeInstallContract/v1")) throw new Error("contrato de instalação ausente");
            console.log(JSON.stringify({ entries: value.entries.length, contracts: value.contract_ids }, null, 2));
          ' "$RUNNER_TEMP/federated-matrix.json"
      - name: Upload local evidence artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: forge-cli-evidence-${{ matrix.os }}-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/portable-create.json
            ${{ runner.temp }}/forge-cli-portable.zip
            ${{ runner.temp }}/federated-matrix.json
          if-no-files-found: error
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      # lf-0019 B1 — o shim Git Bash das Forjas é bash puro: syntax check
      # em todos os OSes (no Windows o `shell: bash` já é o Git Bash).
      - name: bash -n install.windows.sh
        shell: bash
        run: bash -n install.windows.sh
      # lf-0019 B1 — SIMULAÇÃO do cenário corporativo sem PowerShell:
      # PATH reduzido remove powershell.exe (System32\WindowsPowerShell)
      # e pwsh (Program Files\PowerShell) da resolução de nomes; o probe
      # de arquivo continua vendo-os no disco. A rota tem de cair para
      # git_bash com install.windows.sh primeiro na cadeia. Não é E2E de
      # hardware Windows+AD — é gate de seleção de rota no runner real.
      - name: rota Git Bash com PowerShell fora do PATH (simulada)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -u
          NODE_DIR="$(dirname "$(command -v node)")"
          REPORT="$RUNNER_TEMP/env-discover-nops.json"
          mkdir -p "$RUNNER_TEMP/forge-home"
          PATH="$NODE_DIR:/c/Program Files/Git/cmd:/c/Program Files/Git/bin:/c/Program Files/Git/usr/bin:/c/Windows/System32:/c/Windows:/usr/bin" \
          FORGE_CLI_HOME="$RUNNER_TEMP/forge-home" \
            node --import tsx src/index.ts env discover --json > "$REPORT" || true
          node -e '
            const d = require(process.argv[1]);
            const assert = require("node:assert");
            assert.strictEqual(d.shells.powershell.present, false, "powershell.exe deveria estar fora do PATH");
            assert.strictEqual(d.shells.pwsh.present, false, "pwsh deveria estar fora do PATH");
            assert.strictEqual(d.shells.git_bash.present, true, "Git Bash precisa executar no runner");
            assert.strictEqual(d.route.selected, "git_bash", `rota=${d.route.selected}`);
            assert.strictEqual(d.route.script_chain[0], "install.windows.sh");
            console.log("no-PowerShell → git_bash:", JSON.stringify(d.route));
          ' "$REPORT"
