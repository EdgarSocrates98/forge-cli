openapi: 3.0.3
info:
  title: Orders API
  version: 1.1.0
paths:
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        '201':
          description: created
components:
  schemas:
    Order:
      type: object
      required: [id, status]
      properties:
        id: {type: string}
        status: {type: string, enum: [pending, shipped, cancelled]}
        total: {type: number}
    OrderInput:
      type: object
      required: [total, customer_id]
      properties:
        total: {type: number}
        customer_id: {type: string}
        note: {type: string}
